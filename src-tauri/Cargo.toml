[package]
name = "qookit"
version = "0.3.0"
description = "QookiT - 一个基于 russh 的可扩展 SSH 客户端"
authors = ["QookiT"]
license = "GPL-3.0-or-later"
edition = "2021"


[lib]
name = "qookit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SSH 核心
russh = { version = "0.62", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.4"

# 异步运行时
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"

# 凭据加密存储
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# 通用工具
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

# 发布配置：thin LTO + 多 codegen 单元，兼顾体积与 CI 编译速度
# 参考 https://tauri.app/concept/size/#cargo-configuration （原 fat LTO+codegen-units=1 体积最优但编译极慢）
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
