name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v0.3.0'
        required: true
        default: 'v0.3.0'
      prerelease:
        description: '是否为预发布 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_NAME: QookiT

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            toolchain_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-14
            target: macos-universal
            rust_target: universal-apple-darwin
            toolchain_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            toolchain_targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析得到 tag=$TAG version=$VERSION"

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain_targets }}

      - name: 缓存 Cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 打包时会从 tauri-apps/binary-releases 现下工具链（NSIS / linuxdeploy / WiX 等），
      # 上游偶发 5xx 会让整个发布失败。缓存这份目录后，正常情况下只需下载一次。
      - name: 缓存 Tauri 打包工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/tauri
            ~/.cache/tauri
            ~/Library/Caches/tauri
          key: tauri-toolchain-${{ runner.os }}-${{ runner.arch }}-nsis3.11
          restore-keys: |
            tauri-toolchain-${{ runner.os }}-${{ runner.arch }}-

      # 缓存未命中时先带重试下载 NSIS，避免上游一次 500 就中断发布
      - name: 预下载 NSIS 工具链（带重试）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = "$env:LOCALAPPDATA\tauri\NSIS"
          if (Test-Path "$cache\makensis.exe") {
            Write-Host "NSIS 已有缓存，跳过下载"
            exit 0
          }
          $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip"
          $zip = "$env:RUNNER_TEMP\nsis-3.11.zip"
          curl.exe -L --fail --retry 5 --retry-delay 5 --retry-all-errors -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "NSIS 工具链下载失败（curl 退出码 $LASTEXITCODE）" }
          $tmp = "$env:RUNNER_TEMP\nsis-extract"
          Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          # 压缩包可能平铺，也可能带一层 nsis-3.11/ 目录，两种都兼容
          $src = if (Test-Path "$tmp\nsis-3.11") { "$tmp\nsis-3.11" } else { $tmp }
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          Copy-Item "$src\*" $cache -Recurse -Force
          if (-not (Test-Path "$cache\makensis.exe")) { throw "NSIS 解压后未找到 makensis.exe" }
          Write-Host "NSIS 已就绪: $cache"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri 应用
        run: pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: 收集产物 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          STAGING="artifacts"
          mkdir -p "$STAGING"
          # 安装包：NSIS exe（MSIX 在后续步骤生成）
          find "$BUNDLE/nsis" -name '*.exe' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/nsis" -name '*.exe.sig' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          # 便携式：单文件可执行程序（Tauri 2 资源默认嵌入二进制）
          EXE="src-tauri/target/${{ matrix.rust_target }}/release/qookit.exe"
          if [ -f "$EXE" ]; then
            7z a "$STAGING/${PRODUCT_NAME}_${VERSION}_x64-portable.zip" "$EXE"
          fi
          echo "=== Windows 产物（不含 MSIX）==="
          ls -lh "$STAGING"

      - name: 生成 MSIX 包（侧载签名包 + 商店上传包）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $ErrorActionPreference = "Stop"
          # MSIX 版本号必须是四段纯数字（x.y.z.0）；上架商店时第四段必须为 0
          $base = $version -replace '[^0-9.].*$', ''
          if ($base -notmatch '^\d+\.\d+\.\d+$') {
            throw "MSIX 需要 x.y.z 形式的三段版本号，当前 tag 版本为 $version"
          }
          # AppxManifest 模板里写的是 Version="__VERSION__.0"（第四段固定为 0），
          # 所以替换 __VERSION__ 时只能给三段版本号，否则会拼出 1.1.0.0.0 这种非法版本。
          # $msixVersion 是清单里最终应出现的四段版本，仅用于日志与校验。
          $msixVersion = "$base.0"
          Write-Host "MSIX 清单版本: $msixVersion"
          $staging = "msix-staging"
          Remove-Item -Recurse -Force $staging -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "$staging\assets" | Out-Null
          $exe = "src-tauri\target\${{ matrix.rust_target }}\release\qookit.exe"
          if (-not (Test-Path $exe)) { Write-Host "exe 不存在，跳过 MSIX"; exit 0 }
          Copy-Item $exe "$staging\"
          $icons = "src-tauri\icons"
          Copy-Item "$icons\128x128.png"    "$staging\assets\StoreLogo.png"
          Copy-Item "$icons\128x128.png"    "$staging\assets\Square150x150Logo.png"
          Copy-Item "$icons\32x32.png"      "$staging\assets\Square44x44Logo.png"
          Copy-Item "$icons\128x128@2x.png" "$staging\assets\Wide310x150Logo.png"
          Copy-Item "$icons\128x128@2x.png" "$staging\assets\Square310x310Logo.png"
          Copy-Item "$icons\128x128.png"    "$staging\assets\SplashScreen.png"
          # 侧载/仓库直发包身份（自签名证书的 Subject 必须与 Publisher 一致）
          $pkgName = "${{ vars.MSIX_PACKAGE_NAME }}"
          $publisher = "${{ vars.MSIX_PUBLISHER }}"
          if (-not $pkgName)   { $pkgName = "QookiT" }
          if (-not $publisher) { $publisher = "CN=QookiT" }
          # 商店包身份：必须与合作伙伴中心分配的值完全一致，否则上传会被拒绝
          $storePkgName = "${{ vars.MSIX_STORE_PACKAGE_NAME }}"
          $storePublisher = "${{ vars.MSIX_STORE_PUBLISHER }}"
          if (-not $storePkgName)   { $storePkgName = $pkgName }
          if (-not $storePublisher) { $storePublisher = $publisher }
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $latest = (Get-ChildItem $sdkBin -Directory | Where-Object { $_.Name -match "^\d" } | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $makeAppx = Join-Path $latest "x64\MakeAppx.exe"
          $signTool  = Join-Path $latest "x64\signtool.exe"
          Write-Host "使用 SDK 工具: $makeAppx"

          # 同一份 staging 内容按不同身份/签名策略打包：
          #   sideload → 自签名，用于仓库直接分发
          #   store    → 不签名，上传合作伙伴中心后由商店重新签名
          function New-MsixPackage {
            param(
              [string]$PackageName,
              [string]$PublisherName,
              [string]$OutFile,
              [string]$CertPath,
              [string]$CertPassword
            )
            $content = Get-Content "src-tauri\msix\AppxManifest.xml" -Raw
            $content = $content -replace "__PACKAGE_NAME__", $PackageName
            $content = $content -replace "__PUBLISHER__", $PublisherName
            # 模板自带结尾的 .0，这里只代入三段版本号
            $content = $content -replace "__VERSION__", $base
            if (-not $content.Contains("Version=`"$msixVersion`"")) {
              throw "AppxManifest 版本号异常：期望 Version=`"$msixVersion`"，实际内容与预期不符"
            }
            # 不用 Set-Content -Encoding UTF8：Windows PowerShell 会写入 BOM
            [System.IO.File]::WriteAllText(
              (Join-Path $PWD "$staging\AppxManifest.xml"),
              $content,
              (New-Object System.Text.UTF8Encoding($false))
            )
            & $makeAppx pack /d $staging /p $OutFile /nv /o
            if ($LASTEXITCODE -ne 0) { throw "MakeAppx 打包失败: $OutFile" }
            if ($CertPath) {
              & $signTool sign /fd SHA256 /f $CertPath /p $CertPassword $OutFile
              if ($LASTEXITCODE -ne 0) { throw "signtool 签名失败: $OutFile" }
            }
          }

          $certPfxB64 = "${{ secrets.MSIX_CERT_PFX_B64 }}"
          $certPwd    = "${{ secrets.MSIX_CERT_PASSWORD }}"
          if ($certPfxB64) {
            [System.IO.File]::WriteAllBytes("$PWD\sign-cert.pfx", [System.Convert]::FromBase64String($certPfxB64))
            $signCert = "sign-cert.pfx"
            $signPass = $certPwd
            Write-Host "使用正式代码签名证书（侧载包）"
          } else {
            Write-Host "使用自签名证书（Subject 匹配 Publisher）：仅侧载包会签名，商店上传包保持未签名"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -CertStoreLocation "Cert:\CurrentUser\My"
            $tmpPwd = ConvertTo-SecureString -String "qookit-sign" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "sign-cert.pfx" -Password $tmpPwd
            $signCert = "sign-cert.pfx"
            $signPass = "qookit-sign"
          }
          $msixFile = "artifacts\${env:PRODUCT_NAME}_${base}_x64.msix"
          New-MsixPackage -PackageName $pkgName -PublisherName $publisher -OutFile $msixFile -CertPath $signCert -CertPassword $signPass
          Write-Host "侧载签名包完成: $msixFile"

          # 上架 Microsoft Store：包必须保持未签名（商店会重新签名），Publisher 用商店分配的身份
          $storeMsix = "artifacts\${env:PRODUCT_NAME}_${base}_x64_store.msix"
          New-MsixPackage -PackageName $storePkgName -PublisherName $storePublisher -OutFile $storeMsix
          Write-Host "商店上传包完成: $storeMsix"

          # .msixupload 是合作伙伴中心推荐的上传格式（zip 内含 msix）
          $uploadZip = "artifacts\store-upload.zip"
          if (Test-Path $uploadZip) { Remove-Item $uploadZip -Force }
          Compress-Archive -Path $storeMsix -DestinationPath $uploadZip -Force
          Move-Item -Force $uploadZip "artifacts\${env:PRODUCT_NAME}_${base}_x64_store.msixupload"

          Write-Host "=== MSIX 生成完成 ==="
          Get-ChildItem "artifacts\*.msix", "artifacts\*.msixupload" | Format-List FullName, Length

      - name: 收集产物 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          STAGING="artifacts"
          mkdir -p "$STAGING"
          # 安装包：dmg
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          # Updater 产物：.app.tar.gz + .sig（Tauri 2 updater 要求此格式）
          find "$BUNDLE/macos" -name '*.app.tar.gz' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/macos" -name '*.app.tar.gz.sig' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          # 便携式：打包 .app 目录
          APP=$(find "$BUNDLE/macos" -name '*.app' -type d | head -n1)
          if [ -n "$APP" ]; then
            ARCH_TAG="${{ matrix.target }}"
            ARCH="${ARCH_TAG#macos-}"
            tar -czf "$STAGING/${PRODUCT_NAME}_${VERSION}_${ARCH}-portable.tar.gz" -C "$BUNDLE/macos" "$(basename "$APP")"
          fi
          echo "=== macOS 产物 ==="
          ls -lh "$STAGING"

      - name: 收集产物 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          STAGING="artifacts"
          mkdir -p "$STAGING"
          # 安装包：deb / rpm
          find "$BUNDLE/deb" -name '*.deb' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/deb" -name '*.deb.sig' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/rpm" -name '*.rpm' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/appimage" -name '*.AppImage' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/appimage" -name '*.AppImage.sig' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          # 便携式：裸可执行文件 tar.gz
          BIN="src-tauri/target/${{ matrix.rust_target }}/release/qookit"
          if [ -f "$BIN" ]; then
            tar -czf "$STAGING/${PRODUCT_NAME}_${VERSION}_amd64-portable.tar.gz" -C "src-tauri/target/${{ matrix.rust_target }}/release" qookit
          fi
          echo "=== Linux 产物 ==="
          ls -lh "$STAGING"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 列出待发布文件
        shell: bash
        run: |
          echo "=== 待发布文件 ==="
          find release-assets -type f -exec ls -lh {} \;

      - name: 生成 Release 正文
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/gen_release_body.py

      - name: 生成 latest.json (updater)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/gen_latest_json.py

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/*
            latest.json
          body_path: body.md
