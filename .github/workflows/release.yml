name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签，例如 v0.3.0'
        required: true
        default: 'v0.3.0'
      prerelease:
        description: '是否为预发布 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PRODUCT_NAME: QookiT

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: windows-x64
            rust_target: x86_64-pc-windows-msvc
            toolchain_targets: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-14
            target: macos-universal
            rust_target: universal-apple-darwin
            toolchain_targets: aarch64-apple-darwin x86_64-apple-darwin
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            toolchain_targets: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "解析得到 tag=$TAG version=$VERSION"

      - name: 安装系统依赖 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libfuse2

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装 Rust 稳定工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain_targets }}

      - name: 缓存 Cargo 产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Tauri 应用
        run: pnpm tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }}
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: 收集产物 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          STAGING="artifacts"
          mkdir -p "$STAGING"
          # 安装包：NSIS exe（MSIX 在后续步骤生成）
          find "$BUNDLE/nsis" -name '*.exe' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/nsis" -name '*.exe.sig' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          # 便携式：单文件可执行程序（Tauri 2 资源默认嵌入二进制）
          EXE="src-tauri/target/${{ matrix.rust_target }}/release/qookit.exe"
          if [ -f "$EXE" ]; then
            7z a "$STAGING/${PRODUCT_NAME}_${VERSION}_x64-portable.zip" "$EXE"
          fi
          echo "=== Windows 产物（不含 MSIX）==="
          ls -lh "$STAGING"

      - name: 生成 MSIX 包
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $ErrorActionPreference = "Stop"
          $staging = "msix-staging"
          New-Item -ItemType Directory -Force -Path "$staging\assets" | Out-Null
          $exe = "src-tauri\target\${{ matrix.rust_target }}\release\qookit.exe"
          if (-not (Test-Path $exe)) { Write-Host "exe 不存在，跳过 MSIX"; exit 0 }
          Copy-Item $exe "$staging\"
          $icons = "src-tauri\icons"
          Copy-Item "$icons\128x128.png"    "$staging\assets\StoreLogo.png"
          Copy-Item "$icons\128x128.png"    "$staging\assets\Square150x150Logo.png"
          Copy-Item "$icons\32x32.png"      "$staging\assets\Square44x44Logo.png"
          Copy-Item "$icons\128x128@2x.png" "$staging\assets\Wide310x150Logo.png"
          Copy-Item "$icons\128x128@2x.png" "$staging\assets\Square310x310Logo.png"
          Copy-Item "$icons\128x128.png"    "$staging\assets\SplashScreen.png"
          $pkgName = "${{ vars.MSIX_PACKAGE_NAME }}"
          $publisher = "${{ vars.MSIX_PUBLISHER }}"
          if (-not $pkgName)   { $pkgName = "QookiT" }
          if (-not $publisher) { $publisher = "CN=QookiT" }
          $manifest = Get-Content "src-tauri\msix\AppxManifest.xml" -Raw
          $manifest = $manifest -replace "__PACKAGE_NAME__", $pkgName
          $manifest = $manifest -replace "__PUBLISHER__", $publisher
          $manifest = $manifest -replace "__VERSION__", $version
          Set-Content "$staging\AppxManifest.xml" $manifest -Encoding UTF8
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $latest = (Get-ChildItem $sdkBin -Directory | Where-Object { $_.Name -match "^\d" } | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $makeAppx = Join-Path $latest "x64\MakeAppx.exe"
          $signTool  = Join-Path $latest "x64\signtool.exe"
          Write-Host "使用 SDK 工具: $makeAppx"
          $certPfxB64 = "${{ secrets.MSIX_CERT_PFX_B64 }}"
          $certPwd    = "${{ secrets.MSIX_CERT_PASSWORD }}"
          if ($certPfxB64) {
            [System.IO.File]::WriteAllBytes("$PWD\sign-cert.pfx", [System.Convert]::FromBase64String($certPfxB64))
            $signCert = "sign-cert.pfx"
            $signPass = $certPwd
            Write-Host "使用正式代码签名证书（可上 Microsoft Store）"
          } else {
            Write-Host "使用自签名证书（Subject 匹配 Publisher）；上传 Microsoft Store 后 Store 会重新签名，无需购买正式证书"
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $publisher -CertStoreLocation "Cert:\CurrentUser\My"
            $tmpPwd = ConvertTo-SecureString -String "qookit-sign" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "sign-cert.pfx" -Password $tmpPwd
            $signCert = "sign-cert.pfx"
            $signPass = "qookit-sign"
          }
          $msixFile = "artifacts\${env:PRODUCT_NAME}_${version}_x64.msix"
          & $makeAppx pack /d $staging /p $msixFile /nv
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx 打包失败" }
          & $signTool sign /fd SHA256 /f $signCert /p $signPass $msixFile
          if ($LASTEXITCODE -ne 0) { throw "signtool 签名失败" }
          Write-Host "=== MSIX 生成完成 ==="
          Get-Item $msixFile | Format-List FullName, Length

      - name: 收集产物 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          STAGING="artifacts"
          mkdir -p "$STAGING"
          # 安装包：dmg
          find "$BUNDLE/dmg" -name '*.dmg' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/dmg" -name '*.dmg.sig' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          # 便携式：打包 .app 目录
          APP=$(find "$BUNDLE/macos" -name '*.app' -type d | head -n1)
          if [ -n "$APP" ]; then
            ARCH_TAG="${{ matrix.target }}"
            ARCH="${ARCH_TAG#macos-}"
            tar -czf "$STAGING/${PRODUCT_NAME}_${VERSION}_${ARCH}-portable.tar.gz" -C "$BUNDLE/macos" "$(basename "$APP")"
          fi
          echo "=== macOS 产物 ==="
          ls -lh "$STAGING"

      - name: 收集产物 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUNDLE="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          STAGING="artifacts"
          mkdir -p "$STAGING"
          # 安装包：deb / rpm
          find "$BUNDLE/deb" -name '*.deb' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/deb" -name '*.deb.sig' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/rpm" -name '*.rpm' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/appimage" -name '*.AppImage' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          find "$BUNDLE/appimage" -name '*.AppImage.sig' -exec cp {} "$STAGING/" \; 2>/dev/null || true
          # 便携式：裸可执行文件 tar.gz
          BIN="src-tauri/target/${{ matrix.rust_target }}/release/qookit"
          if [ -f "$BIN" ]; then
            tar -czf "$STAGING/${PRODUCT_NAME}_${VERSION}_amd64-portable.tar.gz" -C "src-tauri/target/${{ matrix.rust_target }}/release" qookit
          fi
          echo "=== Linux 产物 ==="
          ls -lh "$STAGING"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE="false"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: 下载所有构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 列出待发布文件
        shell: bash
        run: |
          echo "=== 待发布文件 ==="
          find release-assets -type f -exec ls -lh {} \;

      - name: 生成 Release 正文
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/gen_release_body.py

      - name: 生成 latest.json (updater)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/gen_latest_json.py

      - name: 创建 Release 并上传资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-assets/*
            latest.json
          body_path: body.md
